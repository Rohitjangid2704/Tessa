apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tessa
resources:
  - foundation
  - ../../base/stack
components:
  - ../../components/data-volume
  - ../../components/worker-metrics
images:
  - name: tessa-api
    newName: registry.example.com/tessa/tessa-api
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: tessa-worker
    newName: registry.example.com/tessa/tessa-worker
    newTag: REPLACE_WITH_RELEASE_TAG
  - name: tessa-laya
    newName: registry.example.com/tessa/tessa-laya
    newTag: REPLACE_WITH_RELEASE_TAG
replicas:
  - name: tessa-worker
    count: 2
patches:
  - path: patches/ingress.yaml
    target:
      kind: Ingress
      name: tessa-api
  - path: patches/worker-egress-datastores.yaml
    target:
      kind: NetworkPolicy
      name: tessa-worker-egress-datastores
  - path: patches/worker-egress-external.yaml
    target:
      kind: NetworkPolicy
      name: tessa-worker-egress-external
