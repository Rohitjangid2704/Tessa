apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessa-worker-default-deny
  labels:
    app.kubernetes.io/name: tessa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tessa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessa-worker
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessa-worker-egress-internal
  labels:
    app.kubernetes.io/name: tessa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tessa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessa-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tessa-api
      ports:
        - protocol: TCP
          port: 8000
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tessa-laya
      ports:
        - protocol: TCP
          port: 7006
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessa-worker-egress-datastores
  labels:
    app.kubernetes.io/name: tessa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tessa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessa-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 203.0.113.10/32
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: temporal
      ports:
        - protocol: TCP
          port: 7233
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessa-worker-egress-external
  labels:
    app.kubernetes.io/name: tessa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tessa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessa-worker
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 198.51.100.0/24
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tessa-worker-ingress-metrics
  labels:
    app.kubernetes.io/name: tessa-worker
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: tessa
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tessa-worker
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
