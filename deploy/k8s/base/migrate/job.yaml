apiVersion: batch/v1
kind: Job
metadata:
  name: tessa-migrate
  labels:
    app.kubernetes.io/name: tessa-migrate
    app.kubernetes.io/component: migrate
    app.kubernetes.io/part-of: tessa
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tessa-migrate
        app.kubernetes.io/component: migrate
        app.kubernetes.io/part-of: tessa
    spec:
      restartPolicy: Never
      serviceAccountName: tessa-api
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: tessa-api:replaced-by-overlay
          imagePullPolicy: IfNotPresent
          command:
            - alembic
            - upgrade
            - head
          envFrom:
            - configMapRef:
                name: tessa-api-config
            - secretRef:
                name: tessa-api-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
