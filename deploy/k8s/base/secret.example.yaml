apiVersion: v1
kind: Secret
metadata:
  name: tessa-api-secrets
  namespace: tessa
  labels:
    app.kubernetes.io/name: tessa-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tessa
type: Opaque
stringData:
  TESSA_DATABASE_URL: postgresql+asyncpg://tessa:REPLACE_WITH_DB_PASSWORD@REPLACE_WITH_DB_HOST:5432/tessa
  TESSA_SERVICE_KEY: REPLACE_WITH_GENERATED_SERVICE_KEY
  TESSA_VAULT_KEY: REPLACE_WITH_GENERATED_FERNET_KEY
  TESSA_API_JWT_SECRET: REPLACE_WITH_GENERATED_JWT_SECRET
  TESSA_SIGNING_KEY: REPLACE_WITH_GENERATED_SIGNING_KEY
  TESSA_BOOTSTRAP_ADMIN_PASSWORD: REPLACE_WITH_ADMIN_PASSWORD
  TESSA_OPENAI_API_KEY: REPLACE_WITH_OPENAI_API_KEY
  TESSA_ANTHROPIC_API_KEY: ""
  TESSA_SLACK_WEBHOOK_URL: ""
