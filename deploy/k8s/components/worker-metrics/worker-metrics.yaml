apiVersion: apps/v1
kind: Deployment
metadata:
  name: tessa-worker
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: worker
          readinessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 4
