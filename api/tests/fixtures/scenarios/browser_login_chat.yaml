schema_version: 1
title: Staff signs in and asks the chat
feature_id: smart_log.read.open_maintenance
family: smart-log
role: staff
interface_id: web_ui
timeout_seconds: 240
steps:
  - adapter: browser
    action: goto
    url: /login
    expect:
      dom_state:
        url: /login
        visible:
          - role: button
            name: Sign in
      console:
        fail_on:
          - error
        allow:
          - favicon\.ico
  - adapter: browser
    action: fill
    target:
      role: textbox
      name: Email
    value: ${STAFF_EMAIL}
  - adapter: browser
    action: fill
    target:
      role: textbox
      name: Password
    value: ${STAFF_PASSWORD}
  - adapter: browser
    action: click
    target:
      role: button
      name: Sign in
    expect:
      dom_state:
        url: /
        text_contains:
          - Smart Log
        hidden:
          - selector: "[data-testid=login-error]"
  - adapter: browser
    action: fill
    target:
      selector: "[data-testid=chat-input]"
    value: Which maintenance issues are still open?
  - adapter: browser
    action: press
    value: Enter
  - adapter: browser
    action: wait_for
    expect:
      dom_state:
        text_contains:
          - open
        text_not_contains:
          - Something went wrong
      free_text: Count of open items and the rooms with the most
